<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Marvin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="setup-overlay">
    <button id="setup-btn">Initialize Marvin</button>
    <p id="setup-status">Click once: unlocks microphone + audio. Required by Chrome.</p>
  </div>
  <main hidden id="console">
    <div id="status">standing by</div>
    <button id="ptt" title="hold to talk (or hold Space)">HOLD TO TALK</button>
    <canvas id="wave" width="600" height="80"></canvas>
    <div id="transcript"></div>
    <div id="answer"></div>
    <div id="citations"></div>
    <div id="confirm"></div>
    <div id="projects"></div>
    <div id="finance"></div>
    <div id="fleet"></div>
    <div id="interrupts"></div>
    <!-- M5: validated X search cards. Everything in here is ATTACKER-
         AUTHORED text that survived the server's schema whitelist; the
         renderer uses textContent only, and the single hyperlink per card
         is a server-CONSTRUCTED https://x.com/... status URL, re-checked
         client-side before it ever becomes an href. -->
    <div id="social"></div>
    <!-- What the fleet has left behind. Deliberately BUTTONLESS: removal is a
         spoken instruction ("remove the empty worktrees", "remove the worktree
         for <name>"), never a click, so this pane is purely the surfacing
         half — it shows what each one holds so the instruction is informed. -->
    <div id="worktrees"></div>
    <!-- The worker transcript pane. NOT id="transcript": that id already names
         the live STT pane above, and a duplicate id would send fleet.transcript
         lines into it (querySelector returns the first match). -->
    <pre id="worker-transcript"></pre>
    <footer id="metrics">—</footer>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
