[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.134",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
